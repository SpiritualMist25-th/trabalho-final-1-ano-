<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta         🎮</title>
<script src="../scripts/index.js" defer></script>
<link rel="stylesheet" href="../estilo.css">
  <style>
/* as cores (fundo, laranja, detalhes) vêm do estilo.css, aqui fica só o layout */

main{
    display:flex;                              /* alinha os filhos */
    flex-direction:column;                     /* um embaixo do outro */
    align-items:center;                        /* centraliza na horizontal */
    max-width:400px;                           /* a caixa não abre pros lados */
    box-sizing:border-box;                     /* o padding não aumenta a largura */
    margin:50px auto 0;                        /* centraliza a caixa na tela */
    padding:15px;                              /* espaço dentro da caixa */
    background-color:var(--card);              /* fundo da caixa */
    border-radius:10px;                        /* cantos arredondados */
    border:2px solid var(--detalhe);           /* borda da caixa */
    box-shadow:0px 0px 18px var(--sombra);     /* sombra da caixa */
}

main h1{
    text-align:center;                         /* título centralizado */
}

form{
    display:flex;                              /* alinha os campos */
    flex-direction:column;                     /* um embaixo do outro */
    width:100%;                                /* o formulário ocupa a largura da caixa */
}

label{
    text-align:center;                         /* texto do label centralizado, como no login */
    margin-bottom:10px;                        /* espaço abaixo do label */
}

form input{
    margin-bottom:10px;                        /* espaço entre um campo e o próximo label */
}

form button{
    margin-top:25px;                           /* espaço acima do botão */
    border:3px solid var(--destaque);          /* borda laranja */
    transition:background-color 0.2s, box-shadow 0.2s; /* anima o hover */
}

form button:hover{
    background-color:var(--destaque);          /* fundo laranja no hover */
    color:white;                               /* texto branco no hover */
    box-shadow:0 0 12px var(--destaque);       /* brilho laranja */
}

.msg{
    text-align:center;                         /* mensagem de erro centralizada */
    min-height:1.4em;                          /* reserva espaço para a mensagem do JS */
}

main p{
    text-align:center;                         /* "Já tem conta?" centralizado */
}
  </style>
</head>
<body>
<header>
  <h1>GAME POST          🎮</h1>
<nav>
<a href="../index.html">Início</a>
<a href="post.html">Posts</a>
<a href="login.html" id="linkLogin">login</a>
<a href="sobre.html">Sobre</a>
<a href="config.html">configurações</a>
</nav>
</header>
<main>
<h1>Crie sua conta</h1>
<form id="formConta" novalidate>
<label for="nome">Nome de usuário</label>
<input type="text" id="nome" maxlength="30" autocomplete="username" required>
<label for="email">E-mail</label>
<input type="email" id="email" autocomplete="email" required>
<label for="senha">Senha (mínimo 6 caracteres)</label>
<input type="password" id="senha" autocomplete="new-password" required>
<label for="senha2">Repita a senha</label>
<input type="password" id="senha2" autocomplete="new-password" required>
<button type="submit">Criar conta</button>
<p class="msg" role="alert"></p>
</form>
<p>Já tem conta? <a href="login.html">Faça login</a></p>
</main>
</body>
</html>
