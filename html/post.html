<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo ao fórum</title>
  <script src="../scripts/index.js" defer></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 10px; }
    .layout { display: flex; gap: 20px; align-items: flex-start; }
    .esquerda, .direita { flex: 1; }
    .postar { display: flex; flex-direction: column; gap: 8px; }

    /* carrossel */
    .galeria { position: relative; max-width: 300px; margin: 0 auto; }
    .galeria .images { margin: 0; }
    .galeria img { width: 100%; aspect-ratio: 401 / 650; height: auto; object-fit: cover; border-radius: 10px; display: block; }
    .carrossel-pontos { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
    .carrossel-pontos button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 1px solid #555; background: #ccc; cursor: pointer; }
    .carrossel-pontos button.ativo { background: #000; }

    .post img, #previewImg { max-width: 100%; }
  </style>
</head>

<body>
  <header class="cabecalho-do-post">
    <h1>Fórum da comunidade</h1>
    <nav><a href="index.html">Início</a> <a href="login.html">login</a> <a href="sobre.html">Sobre</a> <a href="config.html">configurações</a></nav>
  </header>

  <main class="layout">
    <aside class="esquerda">
      <h2>Jogos relevantes</h2>

      <div class="galeria">
        <figure class="images">
          <img src="../imagem1.png" alt="Imagem do jogo 1">
        </figure>

        <figure class="images">
          <img src="../imagem2.png" alt="Imagem do jogo 2">
        </figure>

        <figure class="images">
          <img src="../imagem3.png" alt="Imagem do jogo 3">
        </figure>

        <figure class="images">
          <img src="../imagem4.png" alt="Imagem do jogo 4">
        </figure>

        <figure class="images">
          <img src="../imagem5.png" alt="Imagem do jogo 5">
        </figure>

        <figure class="images">
          <img src="../imagem6.png" alt="Imagem do jogo 6">
        </figure>

        <figure class="images">
          <img src="../imagem7.png" alt="Imagem do jogo 7">
        </figure>

        <figure class="images">
          <img src="../imagem8.png" alt="Imagem do jogo 8">
        </figure>
      </div>
    </aside>

    <section class="direita">
      <h2>Criar novo post</h2>

      <form class="postar" id="formPost">
        <label for="titulo">Título do post</label>
        <input
          id="titulo"
          name="titulo-do-post"
          type="text"
          placeholder="Título do seu post"
          maxlength="80"
          required
        >

        <label for="nome">Nome do jogo</label>
        <input
          id="nome"
          name="nomejogo"
          type="text"
          placeholder="Ex.: Elden Ring"
          maxlength="100"
          required
        >

        <label for="descricao">Descrição do post</label>
        <textarea
          id="descricao"
          name="descricaopost"
          placeholder="Fale sobre seu jogo aqui"
          maxlength="4000"
          required
        ></textarea>

        <label for="imagem">Imagem do jogo</label>
        <input
          id="imagem"
          name="foto"
          type="file"
          accept="image/*"
          required
        >

        <small>PNG, JPG ou GIF (máx. 5 MB)</small>

        <div id="imagePreview" hidden>
          <img id="previewImg" alt="Pré-visualização da imagem">
          <button type="button" id="removeImg">Remover imagem</button>
        </div>

        <button type="submit">Publicar no fórum</button>
        <p class="msg" role="alert"></p>
      </form>
    </section>
  </main>

  <section class="posts">
    <h2>Posts da comunidade</h2>
    <div id="feed"></div>
  </section>
</body>
</html>
