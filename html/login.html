<!DOCTYPE html>
<html lang="Pt-Br">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <script src="../scripts/index.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../estilo.css">
        <style>
/* as cores (fundo, laranja, detalhes) vêm do estilo.css, aqui fica só o layout do login */

main{
    display:flex; /* serve para alinhar os elementos filhos */
    flex-direction:column; /* um embaixo do outro */
    align-items:center; /* centraliza na horizontal */
    justify-content:center;
    max-width:400px; /* largura máxima: não abre mais pros lados */
    margin:50px auto 0; /* centraliza a caixa na tela */
    background-color:var(--card); /* cor de fundo da caixa */
    border-radius: 10px; /* borda arredondada do elemento */
    padding: 15px; /* espaço dentro do elemento */
    border: 2px solid var(--detalhe); /* borda do elemento */
    box-shadow: 0px 0px 18px var(--sombra); /* sombra da caixa */
}

main h1{
    text-align:center; /* título centralizado */
}

main label{
    display:flex; /* serve para alinhar os elementos filhos */
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-bottom:10px; /* espaço abaixo do elemento */
}

main input{
    margin-bottom:10px; /* espaço entre um campo e o próximo label */
}

main button{
    margin-top:35px; /* espaço acima do botão */
    border: 3px solid var(--destaque); /* borda laranja */
    transition:background-color 0.2s, box-shadow 0.2s; /* anima as duas mudanças */
    width:100%; /* ocupa toda a largura da caixa */
}

main button:hover{
    background-color:var(--destaque); /* fundo fica laranja no hover */
    color:white; /* texto fica branco para dar contraste */
    box-shadow:0 0 12px var(--destaque); /* brilho laranja em volta */
}

.msg{
    text-align:center; /* mensagem centralizada */
    min-height:1.4em; /* reserva espaço para a mensagem do JS */
}

footer{
    margin-top:125px; /* espaço acima do elemento */
    padding: 15px; /* espaço dentro do elemento */
    border-radius: 10px; /* borda arredondada do elemento */
    background-color: var(--card); /* cor de fundo do elemento */
    text-align:center; /* centraliza o texto */
}
        </style>
    </head>

<body>
    <header>
        <h1>GAME POST       🎮</h1>
        <nav>
            
                <a href="post.html">Poste também</a>
                <a href="sobre.html">Sobre</a>
                <a href="config.html">configurações</a>
            
        </nav>
    </header>

    <main>
        <h1> Faça seu login </h1>

        <div class="input-usuario">
         <label for="email">Digite seu e-mail</label>
         <input type="email" id="email" name="email">
         <label for="senha">Senha</label>
         <input type="password" id="senha" name="senha">
        </div>
        
        <div class="botao">
            <button type="button" id="btnLogin">Log in </button>
            <p class="msg" role="alert"></p>
        </div>

        <p>Não tem uma conta? <a href="criar_conta.html">Crie uma aqui.</a></p>
    </main>
   
        
        <footer>
 <p>
    &copy; 2024 Game Post. Todos os direitos reservados.
 </p>
    </footer>
</body>

 </html>
